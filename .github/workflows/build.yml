name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 发版（创建 GitHub Release 并上传产物）需要写权限
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ""
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
          # push main 时 tagName/releaseName 为空 → 仅构建、不创建 Release
          # push v* tag 时传入 tag 名 → 创建 GitHub Release 并上传产物
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Bilusic {0}', github.ref_name) || '' }}
          releaseBody: |
            A lightweight, open-source desktop music player with pluggable audio sources.

            ## What's New
            See the full changelog in the repository commit history.

            ## Download & Install
            Pick the asset for your platform below:
            - **macOS**: `.dmg`
            - **Windows**: `.msi` / `.exe`
            - **Linux**: `.AppImage` / `.deb` / `.rpm`

            ## 下载与安装
            根据你的平台选择下方资源：
            - **macOS**：`.dmg`
            - **Windows**：`.msi` / `.exe`
            - **Linux**：`.AppImage` / `.deb` / `.rpm`

            ## Disclaimer / 免责声明
            This project is for personal study and research only. Please comply with the terms of service of the music services you connect to. The project does not bundle or host any copyrighted content.

            本项目仅供个人学习与研究使用。请遵守你所接入的各音乐服务的服务条款。项目不内置、不托管任何受版权保护的内容。
          releaseDraft: false
          prerelease: false
          includeDebug: false

